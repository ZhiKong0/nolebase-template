serial:
  port: COM18
  baudrate: 115200
  timeout_s: 0.05
  read_chunk_size: 512
  mode: STRAIGHT
  duration_s: 35.0
  start_after_config: true
  start_command: "#RUN!"
  stop_command: "#STOP!"
telemetry:
  protocol: TEXT
robot:
  wheel_diameter_m: 0.065
  track_width_m: 0.145
  encoder_counts_per_rev: 390.0
  left_count_sign: 1.0
  right_count_sign: 1.0
  initial_pose: [0.0, 0.0, 0.0]
  max_dt_s: 1.0
line_sensor:
  enabled: true
  positions_m: [-0.035, -0.025, -0.015, -0.005, 0.005, 0.015, 0.025, 0.035]
  min_active_count: 1
  variance_m2: 0.0004
reference_path:
  enabled: false
  type: line
  heading_deg: 0.0
  offset_m: 0.0
  csv_path: ""
ekf:
  process_noise:
    position_m2: 0.0004
    heading_rad2: 0.0008
    speed_mps2: 0.04
    omega_radps2: 0.08
    gyro_bias_radps2: 0.0005
  encoder_variance:
    linear_mps2: 0.015
    omega_radps2: 0.03
  yaw_variance_rad2: 0.0015
  gyro_variance_radps2: 0.01
  slip_threshold_radps: 0.9
  slip_encoder_variance_scale: 5.0
optimization:
  enabled: false
  trigger_interval_s: 0.5
  window_size: 40
  max_nfev: 40
  motion_weight: 1.0
  yaw_weight: 1.0
  gyro_weight: 1.0
  speed_weight: 0.5
  line_weight: 0.5
analysis:
  motion_threshold_mps: 0.05
  yaw_jump_threshold_deg: 20.0
  pwm_bias_threshold: 5.0
output:
  root_dir: "000Data/trajectory_reconstruction"
  csv_name_prefix: "trajectory"
  save_raw_bin: true
  save_summary_json: true
  save_plot_png: true
  live_plot: true
commands:
  straight:
    target_speed: 10.0
    speed_pid: [1.50, 0.10, 0.0]
    angle_pid: [6.00, 0.060, 3.20]
    feedforward_gain: 8.7
  track:
    target_speed: 25.0
    speed_pid: [1.50, 0.10, 0.0]
    line_pid: [9.5, 6.8]
    feedforward_gain: 8.7
autotune:
  track:
    strategy: staged
    duration_s: 6.0
    settle_skip_s: 0.8
    repeats: 1
    confirm_best_repeats: 2
    early_stop:
      enabled: true
      min_runtime_s: 1.2
      max_loss_streak: 18
      max_search_streak: 24
      max_stall_streak: 16
      stall_speed_threshold: 12.0
    spd_candidates: [26.0, 28.0, 30.0]
    lkp_candidates: [16.0, 20.0, 24.0]
    lkd_candidates: [6.0, 10.0, 14.0]
    staged:
      spd_steps: [4.0, 2.0, 1.0]
      lkp_steps: [6.0, 3.0, 1.5]
      lkd_steps: [4.0, 2.0, 1.0]
      spd_bounds: [24.0, 34.0]
      lkp_bounds: [12.0, 28.0]
      lkd_bounds: [4.0, 16.0]
  track_adaptive:
    duration_s: 2.4
    settle_skip_s: 0.8
    repeats: 1
    confirm_best_repeats: 2
    early_stop:
      enabled: true
      min_runtime_s: 1.2
      max_loss_streak: 18
      max_search_streak: 24
      max_stall_streak: 16
      stall_speed_threshold: 12.0
    turnaround:
      enabled: true
      timeout_s: 5.5
      settle_s: 0.20
      retries: 1
    params:
      sensor_scale1:
        key: track.sensor_scale1
        start: 0.92
        bounds: [0.89, 0.95]
        steps: [0.015, 0.010, 0.0]
        digits: 3
      sensor_scale2:
        key: track.sensor_scale2
        start: 0.90
        bounds: [0.87, 0.93]
        steps: [0.015, 0.010, 0.0]
        digits: 3
      sensor_scale7:
        key: track.sensor_scale7
        start: 1.13
        bounds: [1.10, 1.16]
        steps: [0.015, 0.010, 0.0]
        digits: 3
      sensor_scale8:
        key: track.sensor_scale8
        start: 1.08
        bounds: [1.05, 1.11]
        steps: [0.015, 0.010, 0.0]
        digits: 3
      lkp:
        key: track.lkp
        start: 9.5
        bounds: [9.0, 10.0]
        steps: [0.3, 0.15, 0.0]
        digits: 3
      static_bias:
        key: track.static_bias
        start: 8.0
        bounds: [6.0, 10.0]
        steps: [1.0, 1.0, 0.0]
        digits: 1
      center_deadband:
        key: track.center_deadband
        start: 53.0
        bounds: [49.0, 57.0]
        steps: [4.0, 2.0, 0.0]
        digits: 1
      pos_lpf:
        key: track.pos_lpf
        start: 0.56
        bounds: [0.52, 0.62]
        steps: [0.03, 0.015, 0.0]
        digits: 3
      d_lpf:
        key: track.d_lpf
        start: 0.46
        bounds: [0.42, 0.52]
        steps: [0.03, 0.015, 0.0]
        digits: 3
      recenter_decay:
        key: track.recenter_decay
        start: 19.0
        bounds: [16.0, 20.0]
        steps: [1.0, 1.0, 0.0]
        digits: 1
