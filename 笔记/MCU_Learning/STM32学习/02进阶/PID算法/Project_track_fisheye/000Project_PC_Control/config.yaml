serial:
  port: COM18
  baudrate: 115200
  timeout_s: 0.05
  read_chunk_size: 512
  mode: STRAIGHT
  duration_s: 35.0
  start_after_config: true
  start_command: "#RUN!"
  stop_command: "#STOP!"
telemetry:
  protocol: TEXT
robot:
  wheel_diameter_m: 0.065
  track_width_m: 0.145
  encoder_counts_per_rev: 390.0
  left_count_sign: 1.0
  right_count_sign: 1.0
  initial_pose: [0.0, 0.0, 0.0]
  max_dt_s: 1.0
line_sensor:
  enabled: true
  positions_m: [-0.055, -0.045, -0.035, -0.025, -0.015, -0.005, 0.005, 0.015, 0.025, 0.035, 0.045, 0.055]
  min_active_count: 1
  variance_m2: 0.0004
reference_path:
  enabled: false
  type: line
  heading_deg: 0.0
  offset_m: 0.0
  csv_path: ""
ekf:
  process_noise:
    position_m2: 0.0004
    heading_rad2: 0.0008
    speed_mps2: 0.04
    omega_radps2: 0.08
    gyro_bias_radps2: 0.0005
  encoder_variance:
    linear_mps2: 0.015
    omega_radps2: 0.03
  yaw_variance_rad2: 0.0015
  gyro_variance_radps2: 0.01
  slip_threshold_radps: 0.9
  slip_encoder_variance_scale: 5.0
optimization:
  enabled: false
  trigger_interval_s: 0.5
  window_size: 40
  max_nfev: 40
  motion_weight: 1.0
  yaw_weight: 1.0
  gyro_weight: 1.0
  speed_weight: 0.5
  line_weight: 0.5
analysis:
  motion_threshold_mps: 0.05
  yaw_jump_threshold_deg: 20.0
  pwm_bias_threshold: 5.0
output:
  root_dir: "000Data/trajectory_reconstruction"
  csv_name_prefix: "trajectory"
  save_raw_bin: true
  save_summary_json: true
  save_plot_png: true
  live_plot: true
commands:
  straight:
    target_speed: 10.0
    speed_pid: [1.50, 0.10, 0.0]
    angle_pid: [6.00, 0.060, 3.20]
    feedforward_gain: 8.7
  track:
    target_speed: 25.0
    speed_pid: [1.50, 0.10, 0.0]
    line_pid: [9.5, 6.8]
    feedforward_gain: 8.7
autotune:
  track:
    strategy: staged
    duration_s: 6.0
    settle_skip_s: 0.8
    repeats: 1
    confirm_best_repeats: 2
    early_stop:
      enabled: true
      min_runtime_s: 1.2
      max_loss_streak: 18
      max_search_streak: 24
      max_stall_streak: 16
      stall_speed_threshold: 12.0
    spd_candidates: [26.0, 28.0, 30.0]
    lkp_candidates: [16.0, 20.0, 24.0]
    lkd_candidates: [6.0, 10.0, 14.0]
    staged:
      spd_steps: [4.0, 2.0, 1.0]
      lkp_steps: [6.0, 3.0, 1.5]
      lkd_steps: [4.0, 2.0, 1.0]
      spd_bounds: [24.0, 34.0]
      lkp_bounds: [12.0, 28.0]
      lkd_bounds: [4.0, 16.0]
  track_adaptive:
    duration_s: 10.0
    speed_target: 40.0
    settle_skip_s: 1.0
    repeats: 2
    confirm_best_repeats: 3
    phases:
      - name: fit
        params: [sensor_scale2, sensor_scale3, sensor_scale4, sensor_scale5, sensor_scale6, sensor_scale7, sensor_scale8, sensor_scale9, sensor_scale10, sensor_scale11, static_bias, deadband, pos_lpf, d_lpf]
        repeats: 1
        confirm_best_repeats: 1
        min_improve: 0.6
      - name: pid
        params: [lkp, lkd, dev_ratio, deadband, pos_lpf, d_lpf, static_bias]
        repeats: 2
        confirm_best_repeats: 2
        min_improve: 1.0
      - name: recovery
        params: [recover_ticks, search_turn_fast, search_turn_slow, search_timeout, sensor_scale1, sensor_scale12]
        repeats: 2
        confirm_best_repeats: 3
        min_improve: 1.0
    score:
      weights:
        mean_forward_speed: 0.20
        center_band_ratio: 24.0
        exact_center_ratio: 18.0
        center_core_ratio: 165.0
        center_single_ratio: -32.0
        straight_ratio: 0.0
        scurve_ratio: 12.0
        outer_ratio: -165.0
        corner_ratio: -150.0
        search_ratio: -240.0
        trim_ratio: -140.0
        loss_ratio: -160.0
        mean_abs_lp: -0.22
        mean_abs_lp_delta: -0.70
        center_mean_abs_lp: -1.35
        center_mean_abs_lp_delta: -3.90
        lp_flip_rate_hz: -16.0
        center_flip_rate_hz: -76.0
        scurve_center_band_ratio: 110.0
        scurve_center_core_ratio: 210.0
        scurve_outer_ratio: -240.0
        scurve_mean_abs_lp: -1.80
        scurve_mean_abs_lp_delta: -5.60
        scurve_flip_rate_hz: -100.0
        edge_recovery_success_ratio: 85.0
        edge_recovery_mean_s: -55.0
        search_recovery_success_ratio: 125.0
        search_recovery_mean_s: -70.0
    early_stop:
      enabled: true
      min_runtime_s: 3.0
      max_loss_streak: 26
      max_search_streak: 52
      max_stall_streak: 24
      stall_speed_threshold: 12.0
    turnaround:
      enabled: false
      timeout_s: 5.5
      settle_s: 0.20
      retries: 1
    params:
      sensor_scale1:
        key: track.sensor_scale1
        start: 1.00
        bounds: [0.96, 1.04]
        steps: [0.020, 0.010, 0.0]
        digits: 3
      sensor_scale2:
        key: track.sensor_scale2
        start: 1.00
        bounds: [0.94, 1.06]
        steps: [0.020, 0.010, 0.0]
        digits: 3
      sensor_scale3:
        key: track.sensor_scale3
        start: 1.00
        bounds: [0.94, 1.06]
        steps: [0.020, 0.010, 0.0]
        digits: 3
      sensor_scale4:
        key: track.sensor_scale4
        start: 0.98
        bounds: [0.94, 1.02]
        steps: [0.020, 0.010, 0.0]
        digits: 3
